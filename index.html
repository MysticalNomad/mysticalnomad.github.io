<!DOCTYPE html>
<html>

<head>
	<title>MysticalNomad.com</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#1e2327" />
	<meta name="color-theme" content="dark light" />

	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link rel="stylesheet" href="/css/fontawesome/css/fontawesome.css">
	<link rel="stylesheet" href="/css/fontawesome/css/all.css">
	<link rel="stylesheet" href="/css/site.css">

	<script src="/js/site.js"></script>
</head>

<body>
	<div id="loading-screen" role="status" aria-live="polite" aria-hidden="true">
		<i class="fa-solid fa-spinner" aria-hidden="true"></i>
		<span>Loading...</span>
	</div>
	<header>
		<div class="logo">
			<img src="/img/logo.jpeg" alt="MysticalNomad.com Logo" />
		</div>
		<div class="header-search">
			<i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
			<input id="search-input" type="search" placeholder="Search all products by number, name, or franchise..."
				aria-label="Search all products by number, name, or franchise" />
			<button id="search-clear" type="button" aria-label="Clear search" hidden>
				<i class="fa-solid fa-xmark" aria-hidden="true"></i>
			</button>
			<button id="camera-search-button" type="button" aria-label="Search by photo">
				<i class="fa-solid fa-camera" aria-hidden="true"></i>
			</button>
			<input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
		</div>
		<button id="nav-toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false"
			aria-controls="main-nav">
			<i class="fa-solid fa-bars"></i>
		</button>
	</header>
	<div id="sort-bar">
		<span>Sort by name:</span>
		<button id="sort-asc" type="button" aria-pressed="false">
			<i class="fa-solid fa-arrow-down-a-z" aria-hidden="true"></i> A–Z
		</button>
		<button id="sort-desc" type="button" aria-pressed="false">
			<i class="fa-solid fa-arrow-down-z-a" aria-hidden="true"></i> Z–A
		</button>
	</div>
	<nav id="main-nav">
		<ul></ul>
	</nav>
	<main>
		<div id="pull-refresh" aria-hidden="true"><i class="fa-solid fa-rotate"></i></div>
		<p id="search-status" hidden></p>
		<p id="filter-status" hidden></p>
		<section id="data-output"></section>

		<section id="ocr-scanner-panel" aria-label="Packaging OCR Scanner">
			<div>
				<button id="startCamBtn" type="button">Start Camera</button>
				<button id="captureBtn" type="button" disabled>Capture &amp; Scan</button>
				<button id="stopCamBtn" type="button" disabled>Stop Camera</button>
				<button id="nativePhotoBtn" type="button">Snap Native Photo</button>
			</div>

			<div id="viewfinder-wrap" style="position:relative;display:none;max-width:100%;">
				<video id="cam" autoplay playsinline muted style="display:block;width:100%;height:auto;"></video>
				<div id="crop-guide" aria-hidden="true"
					style="position:absolute;left:10%;top:25%;width:80%;height:50%;border:2px dashed #52b148;box-sizing:border-box;pointer-events:none;">
				</div>
			</div>

			<pre id="rawText"></pre>

			<form id="ocr-record-form">
				<label>
					Product Number:
					<input id="ocr-product-number" name="productNumber" type="text" />
				</label>
				<label>
					Product Name:
					<input id="ocr-product-name" name="productName" type="text" />
				</label>
				<button id="ocr-action-btn" type="submit">Lookup / Save</button>
			</form>
			<p id="ocr-status" role="status"></p>
		</section>
	</main>
	<footer>&copy;&reg; 2000 MysticalNomad. All rights reserved.</footer>
	<dialog id="image-lightbox" aria-label="Product image">
		<button type="button" aria-label="Close image" title="Close image" autofocus>
			<i class="fa-solid fa-xmark" aria-hidden="true"></i>
		</button>
		<img alt="" />
	</dialog>

	<script type="module">
		import Tesseract from "https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.esm.min.js";

		const startCamBtn = document.getElementById("startCamBtn");
		const captureBtn = document.getElementById("captureBtn");
		const stopCamBtn = document.getElementById("stopCamBtn");
		const nativePhotoBtn = document.getElementById("nativePhotoBtn");
		const cameraInput = document.getElementById("camera-input");
		const viewfinderWrap = document.getElementById("viewfinder-wrap");
		const video = document.getElementById("cam");
		const rawTextEl = document.getElementById("rawText");
		const numberInput = document.getElementById("ocr-product-number");
		const nameInput = document.getElementById("ocr-product-name");
		const actionBtn = document.getElementById("ocr-action-btn");
		const recordForm = document.getElementById("ocr-record-form");
		const statusEl = document.getElementById("ocr-status");
		const searchInput = document.getElementById("search-input");

		let stream = null;
		let worker = null;

		// Crop percentages matching #crop-guide (left: 10%, top: 25%, width: 80%, height: 50%)
		const CROP = { x: 0.1, y: 0.25, w: 0.8, h: 0.5 };

		async function ensureWorker() {
			if (!worker) {
				statusEl.textContent = "Initializing OCR engine...";
				worker = await Tesseract.createWorker("eng");
				statusEl.textContent = "OCR engine ready.";
			}
			return worker;
		}

		async function applyAutofocus(mediaStream) {
			const track = mediaStream.getVideoTracks()[0];
			if (!track || !track.getCapabilities) return;
			const caps = track.getCapabilities();
			if (Array.isArray(caps.focusMode) && caps.focusMode.length > 0) {
				const mode = caps.focusMode.includes("continuous")
					? "continuous"
					: caps.focusMode[0];
				await track.applyConstraints({ advanced: [{ focusMode: mode }] }).catch(() => {});
			}
		}

		function stopCamera() {
			if (stream) {
				stream.getTracks().forEach((track) => track.stop());
				stream = null;
			}
			video.srcObject = null;
			viewfinderWrap.style.display = "none";
			captureBtn.disabled = true;
			stopCamBtn.disabled = true;
			startCamBtn.disabled = false;
		}

		function parseProductFields(text) {
			const lines = text
				.split(/\r?\n/)
				.map((l) => l.trim())
				.filter(Boolean);

			const productNumber =
				lines.find((l) => /\b#?\d{2,6}\b/.test(l))?.match(/#?\d{2,6}/)?.[0] ?? "";
			const productName =
				lines.find((l) => l !== productNumber && /[A-Za-z]{3,}/.test(l)) ?? "";

			return { productNumber, productName };
		}

		// Replace this hook with your catalog lookup (e.g. static JSON/Sheets state or API)
		async function lookupProduct(productNumber, productName) {
			if (searchInput) {
				searchInput.value = productNumber || productName;
				searchInput.dispatchEvent(new Event("input", { bubbles: true }));
			}
			return null;
		}

		// Replace this hook with your database write endpoint (API / serverless / Apps Script)
		async function createProduct(record) {
			console.log("Create new product record:", record);
			statusEl.textContent = `Ready/submitted new item: ${record.productNumber || "(no #)"} - ${record.productName || "(unnamed)"}`;
		}

		async function processSource(source) {
			const ocr = await ensureWorker();
			statusEl.textContent = "Running OCR...";
			const { data: { text } } = await ocr.recognize(source);
			rawTextEl.textContent = text;

			const { productNumber, productName } = parseProductFields(text);
			numberInput.value = productNumber;
			nameInput.value = productName;

			const existing = await lookupProduct(productNumber, productName);
			if (existing) {
				actionBtn.textContent = "Update Existing";
				statusEl.textContent = `Match found for ${productNumber || productName}.`;
			} else {
				actionBtn.textContent = "Create New Product";
				statusEl.textContent = "No exact match found; review extracted fields and create new product.";
			}
		}

		startCamBtn.addEventListener("click", async () => {
			startCamBtn.disabled = true;
			statusEl.textContent = "Starting rear camera...";
			try {
				stream = await navigator.mediaDevices.getUserMedia({
					video: {
						facingMode: { ideal: "environment" },
						width: { ideal: 1920 },
						height: { ideal: 1080 }
					},
					audio: false
				});
				video.srcObject = stream;
				viewfinderWrap.style.display = "block";

				await new Promise((resolve) => {
					if (video.readyState >= 1) return resolve();
					video.addEventListener("loadedmetadata", resolve, { once: true });
				});
				await video.play();
				await applyAutofocus(stream);

				captureBtn.disabled = false;
				stopCamBtn.disabled = false;
				statusEl.textContent = "Align product number and name inside the dashed guide, then capture.";
			} catch (err) {
				statusEl.textContent = `Camera error: ${err.message}`;
				startCamBtn.disabled = false;
			}
		});

		captureBtn.addEventListener("click", async () => {
			if (!stream || !video.videoWidth || !video.videoHeight) return;

			const sx = Math.round(video.videoWidth * CROP.x);
			const sy = Math.round(video.videoHeight * CROP.y);
			const sw = Math.round(video.videoWidth * CROP.w);
			const sh = Math.round(video.videoHeight * CROP.h);

			const canvas = document.createElement("canvas");
			canvas.width = sw;
			canvas.height = sh;
			canvas.getContext("2d").drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);

			stopCamera();
			await processSource(canvas);
		});

		stopCamBtn.addEventListener("click", stopCamera);

		nativePhotoBtn.addEventListener("click", () => {
			cameraInput.click();
		});

		cameraInput.addEventListener("change", async (e) => {
			const file = e.target.files?.[0];
			if (!file) return;
			await processSource(file);
			e.target.value = "";
		});

		recordForm.addEventListener("submit", async (e) => {
			e.preventDefault();
			await createProduct({
				productNumber: numberInput.value.trim(),
				productName: nameInput.value.trim()
			});
		});
	</script>

</body>

</html>
