<!DOCTYPE html>
<html>

<head>
	<title>MysticalNomad.com</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#1e2327" />
	<meta name="color-theme" content="dark light" />

	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link rel="stylesheet" href="/css/fontawesome/css/fontawesome.css">
	<link rel="stylesheet" href="/css/fontawesome/css/all.css">
	<link rel="stylesheet" href="/css/site.css">

	<script src="/js/site.js"></script>
</head>

<body>
	<div id="loading-screen" role="status" aria-live="polite" aria-hidden="true">
		<i class="fa-solid fa-spinner" aria-hidden="true"></i>
		<span>Loading...</span>
	</div>
	<header>
		<div class="logo">
			<img src="/img/logo.jpeg" alt="MysticalNomad.com Logo" />
		</div>
		<div class="header-search">
			<i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
			<input id="search-input" type="search" placeholder="Search all products by number, name, or franchise..." aria-label="Search all products by number, name, or franchise" />
			<button id="search-clear" type="button" aria-label="Clear search" hidden>
				<i class="fa-solid fa-xmark" aria-hidden="true"></i>
			</button>
		</div>
		<button id="nav-toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="main-nav">
			<i class="fa-solid fa-bars"></i>
		</button>
	</header>
	<nav id="main-nav">
		<ul></ul>
	</nav>
	<main>
		<p id="search-status" hidden></p>
		<p id="filter-status" hidden></p>
		<section id="data-output"></section>
	</main>
	<footer>&copy; 2000 MysticalNomad. All rights reserved.</footer>
</body>

</html>
