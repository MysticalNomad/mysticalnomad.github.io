<!DOCTYPE html>
<html>

<head>
	<title>MysticalNomad.com</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#1e2327" />
	<meta name="color-theme" content="dark light" />

	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link rel="stylesheet" href="/css/fontawesome/css/fontawesome.css">
	<link rel="stylesheet" href="/css/fontawesome/css/all.css">
	<link rel="stylesheet" href="/css/site.css">

	<script src="/js/site.js"></script>
</head>

<body>
	<div id="loading-screen" role="status" aria-live="polite" aria-hidden="true">
		<i class="fa-solid fa-spinner" aria-hidden="true"></i>
		<span>Loading...</span>
	</div>
	<header>
		<div class="logo">
			<img src="/img/logo.jpeg" alt="MysticalNomad.com Logo" />
		</div>
		<div class="header-search">
			<i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
			<input id="search-input" type="search" placeholder="Search all products by number, name, or franchise..."
				aria-label="Search all products by number, name, or franchise" />
			<button id="search-clear" type="button" aria-label="Clear search" hidden>
				<i class="fa-solid fa-xmark" aria-hidden="true"></i>
			</button>
			<button id="camera-search-button" type="button" aria-label="Search by photo">
				<i class="fa-solid fa-camera" aria-hidden="true"></i>
			</button>
			<input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
		</div>
		<button id="nav-toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false"
			aria-controls="main-nav">
			<i class="fa-solid fa-bars"></i>
		</button>
	</header>
	<div id="sort-bar">
		<span>Sort by name:</span>
		<button id="sort-asc" type="button" aria-pressed="false">
			<i class="fa-solid fa-arrow-down-a-z" aria-hidden="true"></i> A–Z
		</button>
		<button id="sort-desc" type="button" aria-pressed="false">
			<i class="fa-solid fa-arrow-down-z-a" aria-hidden="true"></i> Z–A
		</button>
	</div>
	<nav id="main-nav">
		<ul></ul>
	</nav>
	<main>
		<div id="pull-refresh" aria-hidden="true"><i class="fa-solid fa-rotate"></i></div>
		<p id="search-status" hidden></p>
		<p id="filter-status" hidden></p>
		<section id="data-output"></section>
	</main>
	<footer>&copy;&reg; 2000 MysticalNomad. All rights reserved.</footer>
	<dialog id="image-lightbox" aria-label="Product image">
		<button type="button" aria-label="Close image" title="Close image" autofocus>
			<i class="fa-solid fa-xmark" aria-hidden="true"></i>
		</button>
		<img alt="" />
	</dialog>

<button id="startCamBtn" type="button">Start Camera</button>
<button id="captureBtn" type="button" disabled>Capture &amp; Scan</button>
<button id="stopCamBtn" type="button" disabled>Stop Camera</button>

<video id="cam" autoplay playsinline muted style="display:none;max-width:100%;"></video>
<pre id="rawText"></pre>

<script type="module">
  import Tesseract from "https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.esm.min.js";

  const startCamBtn = document.getElementById("startCamBtn");
  const captureBtn = document.getElementById("captureBtn");
  const stopCamBtn = document.getElementById("stopCamBtn");
  const video = document.getElementById("cam");

  let stream = null;
  let worker = null;

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach((track) => track.stop());
      stream = null;
    }
    video.srcObject = null;
    video.style.display = "none";
    captureBtn.disabled = true;
    stopCamBtn.disabled = true;
    startCamBtn.disabled = false;
  }

  startCamBtn.addEventListener("click", async () => {
    startCamBtn.disabled = true;
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });
    video.srcObject = stream;
    video.style.display = "block";
    await video.play();

    if (!worker) {
      worker = await Tesseract.createWorker("eng");
    }

    captureBtn.disabled = false;
    stopCamBtn.disabled = false;
  });

  captureBtn.addEventListener("click", async () => {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);

    const { data: { text } } = await worker.recognize(canvas);
    document.getElementById("rawText").textContent = text;

    const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const productNumber = lines.find((l) => /\b#?\d{2,6}\b/.test(l)) ?? "";
    const productName = lines.find((l) => l !== productNumber && /[A-Za-z]{3,}/.test(l)) ?? "";

    console.log({ productNumber, productName });
    stopCamera();
  });

  stopCamBtn.addEventListener("click", stopCamera);
</script>

</body>

</html>
